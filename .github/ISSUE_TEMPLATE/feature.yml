name: Feature
description: Propose a new simulator capability or engineering improvement
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What capability should be added?
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this capability useful or necessary?
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: What must be true for this issue to be considered complete?
      placeholder: |
        - [ ] ...
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: design
    attributes:
      label: Design notes
      description: |
        Optional implementation ideas, constraints, dependencies,
        or architectural considerations.
    validations:
      required: false

  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: How should this feature be tested or validated?
    validations:
      required: false

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Related issues or prerequisite work.
    validations:
      required: false