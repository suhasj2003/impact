name: Conventions

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: conventions-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            test
            docs
            build
            ci
            chore
            revert
            style
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject must begin with a lowercase character.
            Example: "perf(force): vectorize gravity kernel"

  commit-messages:
    name: Conventional commit messages
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys

          pattern = re.compile(
              r'^(feat|fix|perf|refactor|test|docs|build|ci|chore|revert|style)'
              r'(\([A-Za-z0-9._/-]+\))?!?: .+'
          )

          base = os.environ['BASE_SHA']
          head = os.environ['HEAD_SHA']
          output = subprocess.check_output(
              ['git', 'log', '--format=%H%x09%s', f'{base}..{head}'],
              text=True,
          )

          failures = []
          for line in output.splitlines():
              sha, subject = line.split('\t', 1)
              if subject.startswith('Merge '):
                  failures.append(
                      (sha, subject,
                       'merge commits are not allowed on feature branches')
                  )
              elif not pattern.fullmatch(subject):
                  failures.append(
                      (sha, subject,
                       'not a Conventional Commit subject')
                  )

          if failures:
              print('Invalid commit messages:')
              for sha, subject, reason in failures:
                  print(f'  {sha[:8]}  {subject}  ({reason})')

              print('\nExpected examples:')
              print('  feat(physics): add leapfrog integrator')
              print('  fix(tree): handle octant boundary particles')
              print('  perf(force): vectorize gravity kernel')
              print('  feat(backend)!: change backend API')
              sys.exit(1)

          print('All PR commit subjects follow Conventional Commits.')
          PY